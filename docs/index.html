<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 도구 활용 블로그</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1><a href="index.html">AI 도구 활용</a></h1>
            <ul>
                <li><a href="index.html">홈</a></li>
                <li><a href="about.html">소개</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <header class="hero">
            <h1>AI 도구로 시작하는 블로그</h1>
            <p>기획부터 배포까지 90분 안에</p>
        </header>

        <section class="posts-grid" id="posts-grid">
            <!-- 동적으로 로드됨 -->
        </section>
    </main>

    <footer>
        <p>&copy; 2026 AI 도구 활용. All rights reserved.</p>
    </footer>

    <script>
        // data.json에서 글 로드
        async function loadPosts() {
            try {
                const response = await fetch('data.json');
                const posts = await response.json();

                const postsGrid = document.getElementById('posts-grid');
                postsGrid.innerHTML = '';

                // 공개된 글만 표시
                const publishedPosts = posts.filter(post => post.published);

                if (publishedPosts.length === 0) {
                    postsGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 2rem;">작성된 글이 없습니다.</p>';
                    return;
                }

                publishedPosts.forEach(post => {
                    const article = document.createElement('article');
                    article.className = 'post-card';

                    const tagsHtml = post.tags && post.tags.length > 0
                        ? `<p style="color: #999; font-size: 0.9rem; margin-top: 0.5rem;">${post.tags.join(', ')}</p>`
                        : '';

                    article.innerHTML = `
                        <h2><a href="#post-${post.id}">${post.title}</a></h2>
                        <p>${post.content.substring(0, 100)}...</p>
                        ${tagsHtml}
                        <a href="#post-${post.id}" class="read-more">더 보기 →</a>
                    `;

                    postsGrid.appendChild(article);
                });
            } catch (error) {
                console.error('글을 불러올 수 없습니다:', error);
                const postsGrid = document.getElementById('posts-grid');
                postsGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 2rem; color: #999;">글을 불러올 수 없습니다. data.json 파일을 확인해주세요.</p>';
            }
        }

        // 페이지 로드 시 글 불러오기
        window.addEventListener('load', loadPosts);
    </script>
</body>
</html>
